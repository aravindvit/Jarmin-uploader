# Jarmin Uploader — client configuration
#
# Loaded by com.jarmin.uploader.ClientConfig to build a ChunkedStore.

# Storage backend: "file" (local directory) or "server" (remote HTTP endpoint).
storage.mode=file

# Local storage directory — used when storage.mode=file.
# Chunks are written under <client.path>/<key>/<index> plus a manifest.
client.path=./build/jarmin-store

# Base URL of the chunk server — used when storage.mode=server.
server.endpoint=http://localhost:8080

# Bytes per chunk (default: 1 MB = 1048576).
chunk.size=1048576

# Maximum allowed value size in bytes (default: 5 GB = 5368709120).
max.byte.size=5368709120
